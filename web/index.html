<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyLinks</title>
  <!-- cache-busting: WebView2 potrafi trzymać stary CSS mimo restartu -->
  <script>
    (function(){
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'style.css?v=' + Date.now();
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🔗</span>
      <span class="name">PyLinks</span>
      <span class="ver" id="ver">web</span>
      <span class="badge" id="engineBadge">silnik…</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnScan">🔍 Skanuj</button>
      <button class="btn ghost" id="btnMode" title="Tryb grafiki: Ikony (kwadrat, skróty .lnk) / Steam (portret do biblioteki Steam)">🖼 Tryb: Ikony</button>
      <button class="btn ghost" id="btnFit" title="Dopasowanie ikony (kwadrat): całość vs wypełnij">⬚ Dopasowanie</button>
      <button class="btn ghost" id="btnPing" title="Test mostu Python↔JS">⚡ Test mostu</button>
      <button class="btn ghost" id="btnSettings">⚙ Ustawienia</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-group">
        <div class="side-title">Źródła PC <span id="pcTotal" class="muted"></span></div>
        <button class="side-item src active" data-src="">Wszystkie<span class="count" data-c="all">0</span></button>
        <button class="side-item src" data-src="steam">Steam<span class="count" data-c="steam">0</span></button>
        <button class="side-item src" data-src="gog">GOG<span class="count" data-c="gog">0</span></button>
        <button class="side-item src" data-src="epic">Epic<span class="count" data-c="epic">0</span></button>
        <button class="side-item src" data-src="extra">Extra<span class="count" data-c="extra">0</span></button>
      </div>
      <div class="side-group">
        <div class="side-title">Skróty LINKS <span id="platCount" class="muted"></span></div>
        <div id="platforms" class="platforms"><div class="muted pad">—</div></div>
      </div>
    </aside>

    <main class="content">
      <div class="content-head">
        <h1 id="gridTitle">Witaj w nowej wersji PyLinks</h1>
        <span id="gridSub" class="muted"></span>
        <input id="filter" class="filter" type="search" placeholder="Filtruj po nazwie…" hidden>
      </div>
      <div id="grid" class="grid">
        <div class="welcome">
          <p>Nowa wersja na <b>pywebview</b> (HTML/CSS/JS) na silniku <code>pylinks/</code>.</p>
          <p class="muted">Kliknij <b>🔍 Skanuj</b>, aby wykryć gry ze Steam / GOG /
             Epic / Extra i pokazać je w siatce. Ikony i grafiki dojdą w kolejnym kroku.</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="statPaths" class="muted">ścieżki…</span>
    <span id="statBridge" class="pill">most: —</span>
  </footer>

  <!-- Menu kontekstowe (prawy klik na karcie) -->
  <div id="ctxMenu" class="ctx" hidden>
    <button class="ctx-item" data-act="pick">🖼 Wybierz ikonę…</button>
    <button class="ctx-item" data-act="reset">↺ Przywróć automatyczną</button>
  </div>

  <!-- Okno wyboru okładki -->
  <div id="picker" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="pkTitle">Wybierz okładkę</div>
          <div class="modal-sub muted" id="pkSub"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" id="pkReload" title="Odśwież / pobierz ponownie">↻ Odśwież</button>
          <button class="btn ghost" id="pkClose">✕</button>
        </div>
      </div>
      <div class="modal-search">
        <div class="pk-field">
          <input id="pkQuery" type="search" autocomplete="off"
                 placeholder="Szukaj po nazwie lub wklej link/ID ze SteamGridDB…">
          <div id="pkSuggest" class="pk-suggest" hidden></div>
        </div>
        <button class="btn" id="pkSearch">Szukaj</button>
      </div>
      <div id="pkGrid" class="pk-grid"></div>
    </div>
  </div>

  <script>
    (function(){
      var s = document.createElement('script');
      s.src = 'app.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
